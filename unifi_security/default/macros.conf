# ---- Scope -----------------------------------------------------------------
[unifi_index]
definition = index=unifi
description = Index(es) holding UniFi data. Change here if you move the data.

# ---- Event families --------------------------------------------------------
[unifi_cef]
definition = `unifi_index` sourcetype="ubiquiti:unifi:cef"

[unifi_ips]
definition = `unifi_index` eventtype=unifi_ips_threat

[unifi_fw]
definition = `unifi_index` (eventtype=unifi_firewall_block OR eventtype=unifi_fw_rule_log)

[unifi_fw_block]
definition = `unifi_index` eventtype=unifi_firewall_block

[unifi_admin_access]
definition = `unifi_index` eventtype=unifi_admin_access

[unifi_rogue_ap]
definition = `unifi_index` eventtype=unifi_rogue_ap

[unifi_wifi_auth_failure]
definition = `unifi_index` eventtype=unifi_wifi_auth_failure

[unifi_sudo]
definition = `unifi_index` eventtype=unifi_sudo

[unifi_ssh]
definition = `unifi_index` eventtype=unifi_ssh_auth

[unifi_client_connect]
definition = `unifi_index` (eventtype=unifi_client_connect OR eventtype=unifi_dhcp_lease)

# ---- Helpers ---------------------------------------------------------------
[unifi_is_private(1)]
args = field
definition = (cidrmatch("10.0.0.0/8",$field$) OR cidrmatch("172.16.0.0/12",$field$) OR cidrmatch("192.168.0.0/16",$field$) OR cidrmatch("100.64.0.0/10",$field$) OR cidrmatch("127.0.0.0/8",$field$))
description = eval/where boolean - true when the IP is RFC1918 / CGNAT (Tailscale) / loopback

[unifi_geo(1)]
args = field
definition = iplocation $field$ | eval $field$_country=coalesce(nullif(Country,""),"Private/Unknown") | fields - City Region lat lon Country

# ---- Tuning ----------------------------------------------------------------
[unifi_sudo_expected_users]
definition = ("ucs-update", "unifi-access")
description = Service accounts that normally run sudo on UniFi OS. Add to this list to suppress.

[unifi_fw_block_threshold]
definition = 50
description = Firewall blocks per internal client per hour before alerting.

[unifi_wifi_fail_threshold]
definition = 20
description = WiFi association auth failures per client MAC per hour before alerting.

