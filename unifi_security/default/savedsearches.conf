###############################################################################
# UniFi Security - detections
# All alerts ship disabled; enable them in Settings > Searches, reports, and
# alerts. They write to Triggered Alerts only (alert.track = 1); add email /
# webhook actions there as needed.
###############################################################################

[UniFi - IPS Threat Detected]
disabled = 1
description = Any UniFi IDS/IPS (Suricata) detection, aggregated by source/destination pair. action=allowed means the UDM is in detect-only mode or the signature is set to alert, so the traffic was NOT dropped.
search = `unifi_ips` \
| stats count min(_time) as firstTime max(_time) as lastTime values(signature) as signature values(signature_id) as signature_id values(category) as category values(dest_port) as dest_port values(transport) as transport values(action) as action values(direction) as direction values(severity) as severity values(dest_domain) as dest_domain by src dest \
| eval src_scope=if(`unifi_is_private(src)`, "internal", "external") \
| `unifi_geo(src)` \
| convert ctime(firstTime) ctime(lastTime) \
| sort - count
cron_schedule = 1-59/15 * * * *
schedule_window = auto
dispatch.earliest_time = -15m@m
dispatch.latest_time = @m
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = src,dest
alert.suppress.period = 4h
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
action.email = 0
request.ui_dispatch_app = unifi_security
request.ui_dispatch_view = search
display.page.search.tab = statistics
display.general.type = statistics

[UniFi - Outbound IPS Detection From Internal Host]
disabled = 1
description = An IPS signature fired with an internal host as the source talking to an external destination - possible malware, C2 or a compromised IoT device.
search = `unifi_ips` \
| where `unifi_is_private(src)` AND NOT `unifi_is_private(dest)` \
| stats count min(_time) as firstTime max(_time) as lastTime values(signature) as signature values(category) as category values(dest_port) as dest_port values(dest_domain) as dest_domain values(action) as action by src dest \
| `unifi_geo(dest)` \
| convert ctime(firstTime) ctime(lastTime)
cron_schedule = 2-59/15 * * * *
schedule_window = auto
dispatch.earliest_time = -15m@m
dispatch.latest_time = @m
alert.severity = 5
alert.suppress = 1
alert.suppress.fields = src,dest
alert.suppress.period = 4h
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
action.email = 0
request.ui_dispatch_app = unifi_security
request.ui_dispatch_view = search
display.page.search.tab = statistics
display.general.type = statistics

[UniFi - Admin Access From New Source]
disabled = 1
description = UniFi Network / UniFi OS admin access by a user from a source IP not seen for that user in the previous 30 days.
search = `unifi_admin_access` earliest=-30d@d latest=@m \
| stats count min(_time) as firstTime max(_time) as lastTime values(app) as access_method values(dvc) as dvc by user src \
| where firstTime >= relative_time(now(), "-65m@m") \
| eval src_scope=if(`unifi_is_private(src)`, "internal", "external") \
| `unifi_geo(src)` \
| convert ctime(firstTime) ctime(lastTime)
cron_schedule = 5 * * * *
schedule_window = auto
dispatch.earliest_time = -30d@d
alert.severity = 4
dispatch.latest_time = @m
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 0
action.email = 0
request.ui_dispatch_app = unifi_security
request.ui_dispatch_view = search
display.page.search.tab = statistics
display.general.type = statistics

[UniFi - Rogue AP Impersonating SSID]
disabled = 1
description = A UniFi AP detected a third-party AP broadcasting one of your SSIDs (WiFi Impersonation Detected).
search = `unifi_rogue_ap` \
| rename UNIFIbssid as bssid UNIFIwifiChannel as channel UNIFIwifiBand as band UNIFIdetectedByApAndSignalStrength as detected_by \
| stats count min(_time) as firstTime max(_time) as lastTime values(channel) as channel values(band) as band values(detected_by) as detected_by by ssid bssid \
| convert ctime(firstTime) ctime(lastTime)
cron_schedule = 10 * * * *
schedule_window = auto
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = bssid
alert.suppress.period = 24h
dispatch.earliest_time = -60m@m
dispatch.latest_time = @m
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
action.email = 0
request.ui_dispatch_app = unifi_security
request.ui_dispatch_view = search
display.page.search.tab = statistics
display.general.type = statistics

[UniFi - WiFi Authentication Failure Threshold]
disabled = 1
description = A wireless client failed WPA authentication repeatedly in the last hour (wrong PSK, brute force, or misconfigured device).
search = `unifi_wifi_auth_failure` \
| stats count as failures min(_time) as firstTime max(_time) as lastTime dc(host) as ap_count values(host) as aps values(sta_vap) as vaps values(reason) as reason by src_mac \
| where failures >= `unifi_wifi_fail_threshold` \
| convert ctime(firstTime) ctime(lastTime) \
| sort - failures
cron_schedule = 15 * * * *
schedule_window = auto
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = src_mac
alert.suppress.period = 12h
dispatch.earliest_time = -60m@m
dispatch.latest_time = @m
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
action.email = 0
request.ui_dispatch_app = unifi_security
request.ui_dispatch_view = search
display.page.search.tab = statistics
display.general.type = statistics

[UniFi - Excessive Firewall Blocks From Client]
disabled = 1
description = An internal client was blocked by firewall policy more than `unifi_fw_block_threshold` times in an hour - misbehaving or compromised device, or a policy that needs tuning.
search = `unifi_fw_block` \
| stats count min(_time) as firstTime max(_time) as lastTime dc(dest) as dest_count values(dest_domain) as dest_domain values(app) as app values(src_interface) as network by src client_name src_mac \
| where count >= `unifi_fw_block_threshold` \
| convert ctime(firstTime) ctime(lastTime) \
| sort - count
cron_schedule = 20 * * * *
schedule_window = auto
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = src
alert.suppress.period = 6h
dispatch.earliest_time = -60m@m
dispatch.latest_time = @m
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
action.email = 0
request.ui_dispatch_app = unifi_security
request.ui_dispatch_view = search
display.page.search.tab = statistics
display.general.type = statistics

[UniFi - Unexpected sudo On UniFi OS]
disabled = 1
description = sudo executed on the UDM by an account outside `unifi_sudo_expected_users` - interactive admin activity or tampering.
search = `unifi_sudo` NOT sudo_user IN `unifi_sudo_expected_users` \
| stats count min(_time) as firstTime max(_time) as lastTime values(command) as command by host sudo_user sudo_run_as \
| convert ctime(firstTime) ctime(lastTime)
cron_schedule = 3-59/15 * * * *
schedule_window = auto
dispatch.earliest_time = -15m@m
dispatch.latest_time = @m
alert.severity = 4
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 0
action.email = 0
request.ui_dispatch_app = unifi_security
request.ui_dispatch_view = search
display.page.search.tab = statistics
display.general.type = statistics

[UniFi - SSH Activity On UniFi Device]
disabled = 1
description = Successful SSH logins to a UniFi device, or 5+ failed attempts from one source.
search = `unifi_ssh` \
| stats count(eval(action="success")) as successes count(eval(action="failure")) as failures values(user) as user values(authentication_method) as method min(_time) as firstTime max(_time) as lastTime by src host \
| where successes > 0 OR failures >= 5 \
| convert ctime(firstTime) ctime(lastTime)
cron_schedule = 4-59/15 * * * *
schedule_window = auto
dispatch.earliest_time = -15m@m
dispatch.latest_time = @m
alert.severity = 4
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 0
action.email = 0
request.ui_dispatch_app = unifi_security
request.ui_dispatch_view = search
display.page.search.tab = statistics
display.general.type = statistics

[UniFi - New Device On Network]
disabled = 1
description = A client MAC address seen on the network (WiFi/wired connect or DHCP lease) for the first time in 30 days.
search = `unifi_client_connect` earliest=-30d@d latest=@m \
| eval mac=lower(src_mac) \
| where isnotnull(mac) \
| stats min(_time) as firstTime max(_time) as lastTime values(client_name) as client_name values(src_nt_host) as hostname values(src_ip) as ip values(network_name) as network values(ssid) as ssid values(dhcp_interface) as interface by mac \
| where firstTime >= relative_time(now(), "-65m@m") \
| convert ctime(firstTime) ctime(lastTime)
cron_schedule = 25 * * * *
schedule_window = auto
dispatch.earliest_time = -30d@d
alert.severity = 2
dispatch.latest_time = @m
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 0
action.email = 0
request.ui_dispatch_app = unifi_security
request.ui_dispatch_view = search
display.page.search.tab = statistics
display.general.type = statistics
